<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CTP Manager — Khai báo · Valid · Phê duyệt</title>
<style>
  :root{
    --blue:#1F4E78; --blue2:#2E6DA4; --bg:#f2f5f9; --card:#fff; --line:#e3e8ef;
    --ok:#1e8e3e; --warn:#e8a020; --err:#d93025; --muted:#7a8699;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#1a1a1a;font-size:15px;line-height:1.45}
  .hidden{display:none!important}

  /* Login */
  #login{max-width:420px;margin:8vh auto;padding:0 16px}
  .login-card{background:var(--card);border-radius:14px;padding:28px 20px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
  .logo{text-align:center;margin-bottom:18px}
  .logo .t{font-size:20px;font-weight:800;color:var(--blue)}
  .logo .s{font-size:12px;color:var(--muted);margin-top:2px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px;font-weight:600}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#fafbfd;color:#1a1a1a}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue2);background:#fff}
  textarea{resize:vertical;min-height:64px}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;transition:.15s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#eef2f7;color:var(--blue)}
  .btn.danger{background:var(--err)}
  .btn.ok{background:var(--ok)}
  .hint{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}

  /* App shell */
  #app{max-width:680px;margin:0 auto;padding:12px 12px 90px}
  header{background:var(--blue);color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px;position:relative}
  header .app{font-size:17px;font-weight:800}
  header .who{font-size:12px;opacity:.9;margin-top:3px}
  header .logout{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.18);border:none;color:#fff;padding:7px 12px;border-radius:8px;font-size:12.5px;cursor:pointer}

  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
  .tab{flex:1;min-width:86px;text-align:center;padding:10px 6px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}

  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
  .card h3{font-size:14px;color:var(--blue);margin-bottom:10px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .kpi{background:var(--card);border-radius:10px;padding:12px 10px;text-align:center}
  .kpi .v{font-size:20px;font-weight:800;color:var(--blue)}
  .kpi .l{font-size:11px;color:var(--muted);margin-top:2px}
  .kpi.warn .v{color:var(--err)} .kpi.ok .v{color:var(--ok)}

  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .fld{margin-bottom:12px}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .b-wait{background:#fff3d6;color:#9a6b00}.b-gdv{background:#d9ecff;color:#1a56a0}
  .b-gdm{background:#d6f0dd;color:#1e7c3c}.b-reject{background:#fde2df;color:#b3261e}.b-done{background:#d6f0dd;color:#1e7c3c}

  .item{background:var(--card);border-radius:12px;padding:13px 14px;margin-bottom:10px;border:1px solid var(--line)}
  .item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .item .name{font-weight:700;font-size:14.5px}
  .item .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .item .money{font-weight:800;color:var(--blue);font-size:15px;white-space:nowrap}
  .item .body{font-size:13px;margin-top:8px;color:#444}
  .item .acts{display:flex;gap:8px;margin-top:10px}
  .item .acts .btn{padding:9px;font-size:13px;border-radius:8px}
  .valid-box{border-radius:9px;padding:10px 12px;font-size:12.5px;margin-top:10px;line-height:1.5}
  .valid-box.pass{background:#eaf7ef;color:#1e7c3c}
  .valid-box.warn{background:#fff6e5;color:#9a6b00}
  .valid-box.fail{background:#fdecea;color:#b3261e}

  .prog{height:8px;background:#eef2f7;border-radius:6px;overflow:hidden;margin-top:6px}
  .prog>div{height:100%;background:var(--ok);border-radius:6px}
  .prog.over>div{background:var(--err)}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}
  .fab{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);max-width:680px;width:calc(100% - 24px)}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="logo"><div class="t">CTP Manager</div><div class="s">Khai báo · Valid · Phê duyệt công tác phí</div></div>
    <label>Mã nhân viên (Mã NV)</label>
    <input id="maNV" placeholder="VD: NV001 / GDV001 / GDM001" autocomplete="off">
    <label>Mật khẩu (demo: bỏ trống)</label>
    <input id="pw" type="password" placeholder="Bỏ trống nếu chưa có">
    <div style="height:16px"></div>
    <button class="btn" onclick="login()">Đăng nhập</button>
    <div class="hint">Gõ mã NV bất kỳ để xem demo · VD: <b>NV001</b> (NVCH), <b>GDV001</b> (GĐV), <b>GDM001</b> (GĐM)</div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="app">📋 CTP Manager</div>
    <div class="who" id="whoLine"></div>
    <button class="logout" onclick="logout()">Đăng xuất</button>
  </header>

  <div class="tabs" id="tabs"></div>

  <!-- Dashboard -->
  <div id="tab-dash">
    <div class="kpis" id="kpis"></div>
    <div class="card"><h3>Ngân sách GĐV của bạn</h3><div id="myBudget"></div></div>
  </div>

  <!-- Khai báo -->
  <div id="tab-kb" class="hidden">
    <div class="card">
      <h3>Khai báo công tác phí (CTP)</h3>
      <div class="fld"><label>Loại công tác</label>
        <select id="f-loai">
          <option>Hỗ trợ NSO</option><option>Hỗ trợ CH</option><option>Checklist CH</option>
          <option>Họp / Đào tạo</option><option>Khác</option>
        </select></div>
      <div class="row">
        <div class="fld"><label>Điểm đi (CH hiện tại)</label><input id="f-di" placeholder="CH / tỉnh"></div>
        <div class="fld"><label>Điểm đến (NSO/CH)</label><input id="f-den" placeholder="NSO / tỉnh"></div>
      </div>
      <div class="row">
        <div class="fld"><label>Khoảng cách (km)</label><input id="f-km" type="number" placeholder="45" oninput="liveValid()"></div>
        <div class="fld"><label>Số ngày</label><input id="f-ngay" type="number" value="1" min="1" oninput="liveValid()"></div>
      </div>
      <div class="row">
        <div class="fld"><label>Ngày đi</label><input id="f-ngaydi" type="date"></div>
        <div class="fld"><label>Ngày về</label><input id="f-ngayve" type="date"></div>
      </div>
      <div class="row">
        <div class="fld"><label>CTP — ăn/phụ cấp (đ)</label><input id="f-ctp" type="number" placeholder="500000" oninput="calc()"></div>
        <div class="fld"><label>Khách sạn / lưu trú (đ)</label><input id="f-ks" type="number" placeholder="300000" oninput="calc()"></div>
      </div>
      <div class="fld"><label>Xăng / đi lại (đ)</label><input id="f-xang" type="number" placeholder="200000" oninput="calc()"></div>
      <div class="fld"><label>Ghi chú</label><textarea id="f-ghichu" placeholder="Lý do, mục đích chuyến đi..."></textarea></div>
      <div class="fld" style="background:#f6f8fb;border-radius:10px;padding:10px 12px;font-size:13px">
        Tổng chi phí dự kiến: <b id="f-tong" style="color:var(--blue);font-size:16px">0 đ</b>
      </div>
      <div class="valid-box pass hidden" id="validBox"></div>
      <button class="btn" onclick="submitKB()">Gửi khai báo</button>
    </div>
  </div>

  <!-- Danh sách -->
  <div id="tab-ds" class="hidden">
    <div class="card"><h3>Danh sách khai báo</h3><div id="listDS"></div></div>
  </div>

  <!-- Phê duyệt -->
  <div id="tab-pd" class="hidden">
    <div class="card"><h3>Chờ phê duyệt</h3><div id="listPD"></div></div>
  </div>

  <!-- Budget -->
  <div id="tab-budget" class="hidden">
    <div class="card"><h3>Ngân sách theo GĐV (tháng)</h3><div id="listBudget"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ================= DATA =================
const GDV_BUDGET = [
  {ten:"Nguyễn Đức Chung",CH:318,NSO:10,K:1.2,budget:129.0},
  {ten:"Hồ Nam",CH:267,NSO:13,K:1.3,budget:132.9},
  {ten:"Lê Thị Hồng Thu",CH:234,NSO:13,K:1.1,budget:103.4},
  {ten:"Tạ Công Nhận",CH:218,NSO:4,K:1.0,budget:67.5},
  {ten:"Phạm Minh Thu",CH:193,NSO:4,K:1.0,budget:61.3},
  {ten:"Bùi Anh Tuấn",CH:187,NSO:2,K:1.2,budget:65.7},
  {ten:"Nguyễn Mạnh Sơn",CH:165,NSO:20,K:1.5,budget:141.4},
  {ten:"Tạ Quốc Huy",CH:165,NSO:8,K:1.0,budget:64.3},
  {ten:"Nguyễn Duy Đoàn",CH:154,NSO:10,K:1.0,budget:66.5},
  {ten:"Nguyễn Thị Thu",CH:147,NSO:12,K:1.2,budget:83.7},
  {ten:"Đặng Văn Dũng",CH:146,NSO:9,K:1.0,budget:62.0},
  {ten:"Dương Tùng",CH:90,NSO:15,K:1.5,budget:94.5},
  {ten:"Bùi Thị Thu Nhài",CH:94,NSO:6,K:1.0,budget:41.5},
  {ten:"Lạc Nhật Minh",CH:97,NSO:0,K:1.1,budget:30.0},
  {ten:"Nguyễn Năng Toản",CH:86,NSO:6,K:1.2,budget:47.4},
  {ten:"Nguyễn Thị Yến",CH:66,NSO:0,K:1.1,budget:21.5},
];

// Demo users — production sẽ đọc từ Sheet (tab 5-Users)
const USERS = [
  {maNV:"NV001",ten:"Nguyễn Văn A",role:"NV",gdv:"Hồ Nam"},
  {maNV:"NV002",ten:"Trần Thị B",role:"NV",gdv:"Nguyễn Mạnh Sơn"},
  {maNV:"QLKV001",ten:"Lê Văn C",role:"QLKV",gdv:"Hồ Nam"},
  {maNV:"GDV001",ten:"Hồ Nam",role:"GDV",gdv:"Hồ Nam"},
  {maNV:"GDV002",ten:"Nguyễn Mạnh Sơn",role:"GDV",gdv:"Nguyễn Mạnh Sơn"},
  {maNV:"GDM001",ten:"Trần Đăng Hảo",role:"GDM",gdv:"*"},
  {maNV:"ADMIN",ten:"Admin",role:"ADMIN",gdv:"*"},
];

const STORE_KEY = "ctp_records_v1";
const SESSION_KEY = "ctp_session_v1";

function loadRecords(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||[]}catch(e){return[]}}
function saveRecords(r){localStorage.setItem(STORE_KEY,JSON.stringify(r))}
let RECORDS = loadRecords();

// ================= HELPERS =================
const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function fmt(n){return (n||0).toLocaleString("vi-VN")+" đ"}
function fmtTr(n){return n.toLocaleString("vi-VN",{maximumFractionDigits:1})}

function findUser(ma){return USERS.find(u=>u.maNV.toLowerCase()===String(ma).toLowerCase())}
function gdvBudget(gdv){return GDV_BUDGET.find(g=>g.ten===gdv)}
function usedBudget(gdv){return RECORDS.filter(r=>r.gdv===gdv && r.trangThai==="done").reduce((s,r)=>s+(r.tong||0),0)}

const ST_LABEL={cho_gdv:"Chờ GĐV",gdv_duyet:"GĐV duyệt",cho_gdm:"Chờ GĐM",done:"Hoàn tất",tu_choi:"Từ chối"};
const ST_CLASS={cho_gdv:"b-wait",gdv_duyet:"b-gdv",cho_gdm:"b-gdm",done:"b-done",tu_choi:"b-reject"};

// ================= AUTH =================
let ME=null;
function login(){
  const ma=$("maNV").value.trim();
  if(!ma){toast("Vui lòng nhập mã NV");return}
  const u=findUser(ma);
  if(!u){toast("Không tìm thấy mã NV: "+ma);return}
  ME=u;
  sessionStorage.setItem(SESSION_KEY,ma);
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("whoLine").innerHTML = u.ten+" · "+u.role+(u.gdv!=="*"?" · GĐV: "+u.gdv:"");
  buildTabs(); renderAll();
}
function logout(){sessionStorage.removeItem(SESSION_KEY);location.reload()}
(function(){const m=sessionStorage.getItem(SESSION_KEY);if(m){const u=findUser(m);if(u){$("maNV").value=m;login()}}})()

function buildTabs(){
  const t=[["dash","Tổng quan"],["kb","Khai báo"],["ds","Danh sách"]];
  if(ME.role==="GĐV"||ME.role==="GĐM"||ME.role==="ADMIN")t.push(["pd","Phê duyệt"]);
  t.push(["budget","Ngân sách"]);
  $("tabs").innerHTML=t.map(([k,l])=>`<div class="tab${k==="dash"?" active":""}" data-k="${k}" onclick="switchTab('${k}')">${l}</div>`).join("");
}
function switchTab(k){
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.k===k));
  ["dash","kb","ds","pd","budget"].forEach(x=>$("tab-"+x).classList.toggle("hidden",x!==k));
  renderAll();
}

// ================= VALID =================
function validRules(km,soNgay,loai,role,gdv,tong){
  const w=[];let pass=true;
  if(loai==="Hỗ trợ NSO"){
    if(km<=30){w.push("⚠️ Khoảng cách ≤ 30km → theo nguyên tắc KHÔNG hỗ trợ CP (NVCH tự túc).");pass=false}
    else if(km>80 && role==="NV"){w.push("⚠️ Khoảng cách > 80km → chỉ QLKV/đội NSO chuyên trách, không điều động NVCH.");pass=false}
  }
  if(soNgay>2){w.push("⚠️ Số ngày > 2 → cần GĐM duyệt (lý do cụ thể).")}
  if(gdv&&gdv!=="*"){
    const b=gdvBudget(gdv);if(b){
      const rem=b.budget*1000*1000 - usedBudget(gdv);
      if(tong>rem){w.push("🔴 Vượt ngân sách GĐV còn lại ("+fmtTr(rem/1000000)+" tr). Cần duyệt ngoại lệ.");}
    }
  }
  return {pass, w};
}
function liveValid(){const v=$("validBox");const km=+$("f-km").value||0,soNgay=+$("f-ngay").value||1,tong=calc();
  const r=validRules(km,soNgay,$("f-loai").value,ME.role,ME.gdv,tong);
  if(!$("f-km").value && !$("f-ctp").value){v.className="valid-box pass hidden";return}
  v.classList.remove("hidden");
  if(!r.pass){v.className="valid-box fail";v.innerHTML="<b>Lưu ý:</b><br>• "+r.w.join("<br>• ")}
  else{v.className="valid-box pass";v.innerHTML="✅ Hợp lệ — sẵn sàng gửi duyệt."}
}
function calc(){const ctp=+$("f-ctp").value||0,ks=+$("f-ks").value||0,x=+$("f-xang").value||0;
  $("f-tong").textContent=fmt(ctp+ks+x);return ctp+ks+x}

// ================= SUBMIT =================
function submitKB(){
  const loai=$("f-loai").value,di=$("f-di").value.trim(),den=$("f-den").value.trim();
  const km=+$("f-km").value||0,soNgay=+$("f-ngay").value||1;
  const ctp=+$("f-ctp").value||0,ks=+$("f-ks").value||0,x=+$("f-xang").value||0,tong=ctp+ks+x;
  if(!di||!den){toast("Vui lòng nhập điểm đi & điểm đến");return}
  if(!km){toast("Vui lòng nhập khoảng cách");return}
  if(!tong){toast("Vui lòng nhập chi phí");return}
  const r=validRules(km,soNgay,loai,ME.role,ME.gdv,tong);
  let status="cho_gdv";
  if(ME.role==="GDV"){status= soNgay>2||km>80 ? "cho_gdm":"gdv_duyet"; if(status==="gdv_duyet")status="done"}
  if(ME.role==="GDM"||ME.role==="ADMIN"){status="done"}
  const rec={id:Date.now(),maNV:ME.maNV,ten:ME.ten,role:ME.role,gdv:ME.gdv==="*"?pickGdv():ME.gdv,
    loai,di,den,km,soNgay,ngayDi:$("f-ngaydi").value,ngayVe:$("f-ngayve").value,
    ctp,ks,xang:x,tong,ghiChu:$("f-ghichu").value.trim(),
    trangThai:status,ngayTao:new Date().toISOString().slice(0,16).replace("T"," "),
    validWarn:r.w};
  RECORDS.unshift(rec);saveRecords(RECORDS);
  toast("✅ Đã gửi khai báo ("+ST_LABEL[status]+")");
  ["f-di","f-den","f-km","f-ngay","f-ctp","f-ks","f-xang","f-ghichu","f-ngaydi","f-ngayve"].forEach(i=>$("f-"+i==="f-ngay"?i:"f-"+i).value="");
  $("f-ngay").value=1;$("f-loai").value="Hỗ trợ NSO";$("f-tong").textContent="0 đ";$("validBox").className="valid-box pass hidden";
  renderAll();
}
function pickGdv(){const g=prompt("Nhập GĐV chịu ngân sách (tên):","Hồ Nam");return g||"Hồ Nam"}

// ================= APPROVE =================
function approve(id){
  const r=RECORDS.find(x=>x.id===id);if(!r)return;
  if(ME.role==="GĐV"){
    if(r.km>80||r.soNgay>2||r.validWarn.length){r.trangThai="cho_gdm";toast("Đã chuyển GĐM duyệt (cần cấp trên)")}
    else{r.trangThai="done";toast("✅ Đã duyệt")}
  }else{r.trangThai="done";toast("✅ Đã duyệt hoàn tất")}
  saveRecords(RECORDS);renderAll();
}
function reject(id){
  const l=prompt("Lý do từ chối:","");if(l===null)return;
  const r=RECORDS.find(x=>x.id===id);r.trangThai="tu_choi";r.lyDo=l;saveRecords(RECORDS);renderAll();
}

// ================= RENDER =================
function renderAll(){renderKpi();renderBudget();renderDS();renderPD();renderMyBudget()}
function renderKpi(){
  const mine=RECORDS.filter(r=>ME.gdv==="*"?true:r.gdv===ME.gdv);
  const pending=mine.filter(r=>r.trangThai==="cho_gdv"||r.trangThai==="cho_gdm").length;
  const done=mine.filter(r=>r.trangThai==="done").length;
  const total=mine.filter(r=>r.trangThai==="done").reduce((s,r)=>s+r.tong,0);
  $("kpis").innerHTML=`
    <div class="kpi"><div class="v">${mine.length}</div><div class="l">Khai báo</div></div>
    <div class="kpi warn"><div class="v">${pending}</div><div class="l">Chờ duyệt</div></div>
    <div class="kpi ok"><div class="v">${fmtTr(total/1000000)}<small>tr</small></div><div class="l">Đã duyệt</div></div>`;
}
function renderMyBudget(){
  if(ME.gdv==="*"){$("myBudget").innerHTML='<div class="empty">GĐM / Admin xem tổng ở tab "Ngân sách".</div>';return}
  const b=gdvBudget(ME.gdv);if(!b){$("myBudget").innerHTML='<div class="empty">Chưa có ngân sách cho GĐV này.</div>';return}
  const used=usedBudget(ME.gdv),rem=b.budget*1e6-used,pct=used/(b.budget*1e6)*100;
  const over=pct>100;
  $("myBudget").innerHTML=`
    <div style="font-size:13px;color:#555">Tổng: <b>${fmtTr(b.budget)} tr</b> · Đã dùng: <b>${fmtTr(used/1e6)} tr</b> · Còn: <b style="color:${over?'var(--err)':'var(--ok)'}">${fmtTr(rem/1e6)} tr</b></div>
    <div class="prog ${over?'over':''}"><div style="width:${Math.min(pct,100)}%"></div></div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:5px">${fmtTr(pct)}% ngân sách đã dùng</div>`;
}
function renderBudget(){
  $("listBudget").innerHTML=GDV_BUDGET.map(g=>{
    const used=usedBudget(g.ten),rem=g.budget*1e6-used,pct=used/(g.budget*1e6)*100,over=pct>100;
    return `<div class="item"><div class="top"><div><div class="name">${g.ten}</div>
      <div class="meta">${g.CH} CH · ${g.NSO} NSO · K=${g.K}</div></div>
      <div class="money">${fmtTr(g.budget)} tr</div></div>
      <div class="prog ${over?'over':''}" style="margin-top:8px"><div style="width:${Math.min(pct,100)}%"></div></div>
      <div class="meta" style="margin-top:4px">Đã dùng ${fmtTr(used/1e6)} tr · Còn ${fmtTr(rem/1e6)} tr</div></div>`}).join("");
}
function itemHtml(r,showActs){
  const st=ST_LABEL[r.trangThai]||r.trangThai;
  const cls=ST_CLASS[r.trangThai]||"b-wait";
  return `<div class="item"><div class="top"><div><div class="name">${r.ten} <span style="font-weight:400;font-size:12px;color:var(--muted)">(${r.role})</span></div>
    <div class="meta">${r.loai} · ${r.di} → ${r.den} · ${r.km}km · ${r.soNgay} ngày · ${r.ngayTao}</div></div>
    <div style="text-align:right"><div class="money">${fmt(r.tong)}</div><span class="badge ${cls}">${st}</span></div></div>
    <div class="body">${r.ghiChu||""}${r.lyDo?'<div style="color:var(--err);margin-top:3px">↳ Từ chối: '+r.lyDo+'</div>':''}
    ${r.validWarn&&r.validWarn.length?'<div class="valid-box warn" style="margin-top:8px">'+r.validWarn.map(x=>"• "+x).join("<br>")+'</div>':""}</div>
    ${showActs&&(r.trangThai==="cho_gdv"||r.trangThai==="cho_gdm")?`<div class="acts">
      <button class="btn ok" onclick="approve(${r.id})">Duyệt</button>
      <button class="btn danger" onclick="reject(${r.id})">Từ chối</button></div>`:""}</div>`;
}
function renderDS(){
  const mine=RECORDS.filter(r=>ME.gdv==="*"?true:r.gdv===ME.gdv);
  if(!mine.length){$("listDS").innerHTML='<div class="empty">Chưa có khai báo nào.</div>';return}
  $("listDS").innerHTML=mine.map(r=>itemHtml(r,false)).join("");
}
function renderPD(){
  if(!(ME.role==="GĐV"||ME.role==="GĐM"||ME.role==="ADMIN")){$("listPD").innerHTML='<div class="empty">Chỉ GĐV/GĐM mới phê duyệt.</div>';return}
  let pool=RECORDS;
  if(ME.role==="GĐV")pool=pool.filter(r=>r.gdv===ME.gdv && (r.trangThai==="cho_gdv"));
  else pool=pool.filter(r=>r.trangThai==="cho_gdm"||r.trangThai==="cho_gdv");
  if(!pool.length){$("listPD").innerHTML='<div class="empty">Không có phiếu chờ duyệt.</div>';return}
  $("listPD").innerHTML=pool.map(r=>itemHtml(r,true)).join("");
}
</script>
</body>
</html>
